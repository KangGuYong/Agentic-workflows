[project]
name = "engine"
version = "0.1.0"
description = "Agentic workflow engine core: DSL, validator, LangGraph compiler"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.13,<3",
    "jinja2>=3.1.6,<4",
    "httpx>=0.28,<1",
    "langgraph>=1.2.11,<1.3",
    "langgraph-checkpoint-postgres>=3.1,<4",
    "psycopg[binary,pool]>=3.2,<4",
    "pycryptodome>=3.21,<4",
    "redis>=5.2,<6",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "alembic>=1.14,<2",
    "pebble>=5.1,<6",
]

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "pytest-asyncio>=1.4,<2",
    "ruff>=0.8,<1",
    "testcontainers[postgres,redis]>=4.9,<5",
    "trustme>=1.1,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["integration: needs Postgres/Redis containers"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "SIM"]
